services:
  postgres:
    image: postgres:15.3
    container_name: workshop-api-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workshopDb
    ports:
      - "5438:5432"
    volumes:
      - workshop_api_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workshopDb"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  workshop_api_data: